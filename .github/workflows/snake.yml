name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG (Red Theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=red&color_dots=#161b22,#3b1219,#7a1c27,#b92b3a,#ff4d4d
            dist/github-contribution-grid-snake-dark.svg?color_snake=red&color_dots=#161b22,#3b1219,#7a1c27,#b92b3a,#ff4d4d
            dist/snake.svg?color_snake=red&color_dots=#161b22,#3b1219,#7a1c27,#b92b3a,#ff4d4d

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
